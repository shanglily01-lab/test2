<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>破位机会策略 | Neural Obsidian</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Manrope', sans-serif; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; letter-spacing: 0; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 420, 'GRAD' 0, 'opsz' 22; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .long { color:#49f4c8; background:rgba(73,244,200,.12); border:1px solid rgba(73,244,200,.24); }
  .short { color:#ff716c; background:rgba(255,113,108,.12); border:1px solid rgba(255,113,108,.24); }
  .flat { color:#a8abb2; background:rgba(168,171,178,.10); border:1px solid rgba(168,171,178,.18); }
</style>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: { colors: {
    "surface":"#0a0f14", "surface-container-low":"#0f1419", "surface-container":"#151a20",
    "surface-container-highest":"#20262e", "outline-variant":"#44484e",
    "on-surface":"#ebeef5", "on-surface-variant":"#a8abb2",
    "primary":"#49f4c8", "secondary":"#5b9eff", "error":"#ff716c"
  }}}
}
</script>
</head>
<body class="bg-surface text-on-surface">
{% include "partials/desktop_sidebar.html" %}
<main class="ml-[240px] min-h-screen">
  <header class="border-b border-outline-variant/15 px-8 py-5 flex items-center justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-2xl font-bold">破位机会策略</h1>
      <p class="text-[11px] text-on-surface-variant mt-1">市值前100 · 大趋势定方向 · 阶段整理后 15M 放量破位 · C1/C3/B2/B3/C4 确认后市价跟风</p>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
      <div class="flex items-center gap-2">
        <span class="text-[11px] text-on-surface-variant">做多</span>
        <button id="toggle-long" type="button" data-enabled="false"
          class="h-9 px-3 rounded bg-surface-container-highest text-on-surface-variant text-xs font-bold border border-outline-variant/20">
          关
        </button>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[11px] text-on-surface-variant">做空</span>
        <button id="toggle-short" type="button" data-enabled="false"
          class="h-9 px-3 rounded bg-surface-container-highest text-on-surface-variant text-xs font-bold border border-outline-variant/20">
          关
        </button>
      </div>
      <button id="btn-run" class="h-9 px-3 rounded bg-primary text-[#002045] text-xs font-bold inline-flex items-center gap-1">
        <span class="material-symbols-outlined text-[17px]">play_arrow</span> 扫描
      </button>
      <button id="btn-refresh" class="h-9 w-9 rounded bg-surface-container-highest text-on-surface-variant" title="刷新">
        <span class="material-symbols-outlined text-[18px]">refresh</span>
      </button>
    </div>
  </header>

  <section class="px-8 py-5 grid grid-cols-2 lg:grid-cols-5 gap-3">
    <div class="bg-surface-container-low p-4 rounded-lg border border-outline-variant/10">
      <p class="text-[10px] text-on-surface-variant uppercase">当前总方向</p>
      <p id="stat-bias" class="mt-2 text-xl font-bold mono">--</p>
    </div>
    <div class="bg-surface-container-low p-4 rounded-lg border border-outline-variant/10">
      <p class="text-[10px] text-on-surface-variant uppercase">扫描频率</p>
      <p id="stat-interval" class="mt-2 text-xl font-bold mono">--</p>
    </div>
    <div class="bg-surface-container-low p-4 rounded-lg border border-outline-variant/10">
      <p class="text-[10px] text-on-surface-variant uppercase">交易池</p>
      <p id="stat-universe" class="mt-2 text-xl font-bold mono">--</p>
    </div>
    <div class="bg-surface-container-low p-4 rounded-lg border border-outline-variant/10">
      <p class="text-[10px] text-on-surface-variant uppercase">最近机会</p>
      <p id="stat-opp" class="mt-2 text-xl font-bold mono">--</p>
    </div>
    <div class="bg-surface-container-low p-4 rounded-lg border border-outline-variant/10">
      <p class="text-[10px] text-on-surface-variant uppercase">当前持仓</p>
      <p id="stat-pos" class="mt-2 text-xl font-bold mono">--</p>
    </div>
  </section>

  <section class="px-8 pb-5">
    <h2 class="text-sm font-semibold mb-3">趋势维度方向判断</h2>
    <div id="trend-grid" class="grid md:grid-cols-3 xl:grid-cols-6 gap-3"></div>
  </section>

  <section class="px-8 pb-5 grid xl:grid-cols-[1fr_390px] gap-4">
    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold">大趋势里的阶段破位点</h2>
        <p id="last-run" class="text-[11px] text-on-surface-variant mono">--</p>
      </div>
      <div class="overflow-x-auto rounded-lg border border-outline-variant/10">
        <table class="w-full text-left text-xs">
          <thead class="bg-surface-container text-on-surface-variant uppercase text-[10px]">
            <tr>
              <th class="px-3 py-2">交易对</th>
              <th class="px-3 py-2">方向</th>
              <th class="px-3 py-2">动作</th>
              <th class="px-3 py-2">未来4H</th>
              <th class="px-3 py-2">评分</th>
              <th class="px-3 py-2">破位类型</th>
              <th class="px-3 py-2">订单参数</th>
              <th class="px-3 py-2">多周期摘要</th>
            </tr>
          </thead>
          <tbody id="opportunity-body" class="divide-y divide-outline-variant/10"></tbody>
        </table>
      </div>
    </div>
    <aside class="space-y-4">
      <div>
        <h2 class="text-sm font-semibold mb-3">当前持仓</h2>
        <div id="positions-list" class="space-y-2 text-xs"></div>
      </div>
      <div>
        <h2 class="text-sm font-semibold mb-3">最近订单</h2>
        <div id="orders-list" class="space-y-2 text-xs"></div>
      </div>
      <div>
        <h2 class="text-sm font-semibold mb-3">市值前100 交易池</h2>
        <div id="universe-list" class="flex flex-wrap gap-1.5 text-[11px] mono"></div>
      </div>
    </aside>
  </section>
</main>
<script src="/static/js/midline_strategy_page.js?v=6"></script>
</body>
</html>
